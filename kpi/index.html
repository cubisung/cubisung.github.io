<script>
let SEED = null;
// ===== KPI ENGINE – bám đúng công thức mục 5 & file Excel =====
const KPI = (function () {
  const N = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const isNum = v => typeof v === 'number' && isFinite(v);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  let D = null, CT = null, BY = null;

  function init(data) {
    D = data; CT = data.chi_tieu.slice().sort((a, b) => a.stt - b.stt);
    BY = {}; data.can_bo.forEach(c => (BY[c.ma] = c));
  }
  const weights = ma => D.trong_so_theo_vi_tri[BY[ma].vi_tri] || {};
  const w = (ma, ct) => { const v = weights(ma)[ct]; return isNum(v) && v !== 0 ? v : null; };
  const isBinaryLike = c => c.loai === 'binary' || c.ma === 'dmst';
  const PERSONAL = ['THUANNH', 'PHONGTDM', 'THANHDT7', 'TRAMNDN', 'HUYENNN2', 'BAUCT', 'QUYNNHTT'];
  const GROUPS = ['HUYENHLL', 'NAM.DOHOAI'];
  const groupOf = ma => GROUPS.find(g => GROUP_RULE[g].members.includes(ma)) || null;

  // ---- Một dòng chỉ tiêu: %HT, điểm, dự kiến từ số đóng GAP J ----
  function row(c, wt, E, F, J, V) {
    const cap = c.ty_le_toi_da, r = { ct: c, w: wt, cap, E, F, J, V };
    if (c.loai === 'inverse') {
      r.G = (F == null || E == null) ? null : (E <= 0 ? cap : F / E);
      r.K = (F == null || (E == null && J == null)) ? null : (N(E) + N(J) <= 0 ? cap : F / (N(E) + N(J)));
      r.Wp = (F == null || (E == null && V == null)) ? null : (N(E) + N(V) <= 0 ? cap : F / (N(E) + N(V)));
      r.gap = (F == null || E == null) ? null : Math.max(0, E - F);
    } else {
      r.G = (!F || E == null) ? null : E / F;
      r.K = !F ? null : (E == null && N(J) === 0 ? null : (N(E) + N(J)) / F);
      r.Wp = !F ? null : (E == null && N(V) === 0 ? null : (N(E) + N(V)) / F);
      r.gap = !F ? null : Math.max(0, F - N(E));
    }
    const sc = p => (wt == null || p == null) ? null : wt * Math.max(0, Math.min(cap, p));
    r.H = sc(r.G); r.L = sc(r.K); r.X = sc(r.Wp);
    return r;
  }
  function totals(rows) {
    let t = { H: 0, L: 0, X: 0, wData: 0, wPlan: 0, max: 0, wTotal: 0 };
    rows.forEach(r => {
      if (r.w == null) return;
      t.wTotal += r.w; t.max += r.w * r.cap;
      t.H += N(r.H); t.L += N(r.L); t.X += N(r.X);
      if (r.G != null) t.wData += r.w;
      if (r.K != null) t.wPlan += r.w;
    });
    return t;
  }

  // ---- Số đóng GAP của cán bộ (cột J) từ tỷ lệ đã nhập ----
  function personalJ(ma, ctMa, rates) {
    const c = CT.find(x => x.ma === ctMa), s = BY[ma].so_lieu[ctMa] || {};
    const E = s.thuc_hien, F = s.ke_hoach_nam, rate = rates ? rates[ctMa] : null;
    if (rate == null || !F) {
      if (c.loai === 'flow' || c.loai === 'bq') return E == null ? null : Math.max(0, E) / 3;
      if (c.loai === 'level') return 0;
      return null; // binary / inverse
    }
    return Math.min(c.ty_le_toi_da, Math.max(0, rate)) * F - N(E);
  }

  // plans: { MA: { rates: {ct: p}, ... } }
  function evalPersonal(ma, plans) {
    const rates = plans && plans[ma] ? plans[ma].rates : null;
    const dx = D.de_xuat[ma] || {};
    const rows = CT.map(c => {
      const s = BY[ma].so_lieu[c.ma] || {};
      const J = personalJ(ma, c.ma, rates);
      // cán bộ chỉ theo dõi (THAODTV) chưa có đề xuất của Phòng → đề xuất = kế hoạch/giữ tốc độ
      const V = isNum(dx[c.ma]) ? dx[c.ma] : (TRACK_ONLY.includes(ma) ? J : null);
      return row(c, w(ma, c.ma), s.thuc_hien, s.ke_hoach_nam, J, V);
    });
    return { ma, rows, t: totals(rows) };
  }

  // ---- Cách cộng nhóm/Phòng ----
  // 'moi' (từ 29/10): HUYENHLL: NV, CASA = tổng tất cả CB; NII nhập thủ công; còn lại = BAUCT + QUYNNHTT + THAODTV.
  //                   NAM.DOHOAI: tất cả = PHONGTDM + THANHDT7 + TRAMNDN. Phòng: TH/KH giữ số tổng của file;
  //                   dự kiến = Σ kế hoạch tất cả CB + phần còn lại của Phòng theo tốc độ 9 tháng.
  // 'excel': đúng file Excel gốc (dùng để đối chiếu ca kiểm thử mục 9).
  let RULE = 'moi';
  const TRACK_ONLY = ['THAODTV'];
  const ALLCB = () => [...PERSONAL, ...TRACK_ONLY.filter(m => BY[m])];
  const GROUP_RULE = {
    HUYENHLL: { members: ['BAUCT', 'QUYNNHTT', 'THAODTV'], all: ['nv', 'casa'], manual: ['nii'] },
    'NAM.DOHOAI': { members: ['PHONGTDM', 'THANHDT7', 'TRAMNDN'], all: [], manual: [] }
  };
  const sumOrNull = arr => arr.every(v => v == null) ? null : arr.reduce((a, v) => a + N(v), 0);
  const getEval = (m, plans, cache) => cache[m] || (cache[m] = evalPersonal(m, plans));
  // ghi đè số liệu (THAODTV tự nhập, NII thủ công HUYENHLL, số mới nhất…)
  function setSoLieu(ma, ct, vals) {
    if (!BY[ma]) BY[ma] = { ma, ho_ten: ma, vi_tri: null, cap: 'Cán bộ theo dõi', so_lieu: {} };
    const s = BY[ma].so_lieu[ct] = { ...(BY[ma].so_lieu[ct] || {}) };
    ['thuc_hien', 'ke_hoach_nam'].forEach(k => { if (k in vals) s[k] = isNum(vals[k]) ? vals[k] : null; });
  }

  function evalGroup(g, plans, cache) {
    if (RULE === 'moi') return evalGroupMoi(g, plans, cache);
    const mem = BY[g].thanh_vien_co_bang_rieng || [];
    const ev = mem.map(m => cache[m] || (cache[m] = evalPersonal(m, plans)));
    const bs = (D.bo_sung_nhom || {})[g] || {};
    const rows = CT.map((c, i) => {
      const s = BY[g].so_lieu[c.ma] || {};
      let J = null, V = null;
      if (c.cong_len_nhom) {
        J = ev.reduce((a, e) => a + N(e.rows[i].J), 0) + N(bs[c.ma]);
        V = ev.reduce((a, e) => a + N(e.rows[i].V), 0) + N(bs[c.ma]);
      }
      const r = row(c, w(g, c.ma), s.thuc_hien, s.ke_hoach_nam, J, V);
      r.Jcb = c.cong_len_nhom ? J - N(bs[c.ma]) : null; r.bs = bs[c.ma];
      return r;
    });
    return { ma: g, rows, t: totals(rows) };
  }

  function evalGroupMoi(g, plans, cache) {
    const R = GROUP_RULE[g], rows = CT.map((c, i) => {
      const s = BY[g].so_lieu[c.ma] || {};
      let E = s.thuc_hien, F = s.ke_hoach_nam, J = null, V = null, src = 'file';
      if (c.cong_len_nhom && R.manual.includes(c.ma)) {
        J = personalJ(g, c.ma, plans && plans[g] ? plans[g].rates : null);
        V = E == null ? null : 1.3 * Math.max(0, E) / 3; src = 'manual';
      } else if (c.cong_len_nhom) {
        const mem = R.all.includes(c.ma) ? ALLCB() : R.members.filter(m => BY[m]);
        const ev = mem.map(m => getEval(m, plans, cache).rows[i]);
        E = sumOrNull(ev.map(r => r.E)); F = sumOrNull(ev.map(r => r.F));
        J = ev.reduce((a, r) => a + N(r.J), 0); V = ev.reduce((a, r) => a + N(r.V), 0);
        src = R.all.includes(c.ma) ? 'all' : 'members';
      }
      const r = row(c, w(g, c.ma), E, F, J, V); r.src = src; return r;
    });
    return { ma: g, rows, t: totals(rows) };
  }

  function evalPhong(plans, cache) {
    cache = cache || {};
    if (RULE === 'moi') {
      const tt = D.phong_so_truc_tiep || {}, cbs = ALLCB();
      const rows = CT.map((c, i) => {
        const s = BY.THAMNN.so_lieu[c.ma] || {}, d = tt[c.ma] || {};
        const E = (s.thuc_hien == null && d.thuc_hien == null) ? null : N(s.thuc_hien) + N(d.thuc_hien);
        const F = (s.ke_hoach_nam == null && d.ke_hoach_nam == null) ? null : N(s.ke_hoach_nam) + N(d.ke_hoach_nam);
        let J = null, V = null, rest = null;
        if (c.cong_len_nhom) {
          const ev = cbs.map(m => getEval(m, plans, cache).rows[i]);
          const restE = N(E) - ev.reduce((a, r) => a + N(r.E), 0);
          rest = (c.loai === 'flow' || c.loai === 'bq') ? Math.max(0, restE) / 3 : 0; // phần còn lại (LĐ, CB không lập bảng, số trực tiếp)
          J = ev.reduce((a, r) => a + N(r.J), 0) + rest;
          V = ev.reduce((a, r) => a + N(r.V), 0) + rest;
        }
        const r = row(c, w('THAMNN', c.ma), E, F, J, V); r.bs = rest; return r;
      });
      return { ma: 'THAMNN', rows, t: totals(rows) };
    }
    const parts = ['HUYENHLL', 'NAM.DOHOAI', 'THUANNH', 'HUYENNN2'];
    const ev = parts.map(p => cache[p] || (cache[p] = GROUPS.includes(p) ? evalGroup(p, plans, cache) : evalPersonal(p, plans)));
    const tt = D.phong_so_truc_tiep || {}, bs = D.bo_sung_phong || {};
    const rows = CT.map((c, i) => {
      // Thực hiện/KH Phòng = cộng từ nhóm/CB (so_lieu THAMNN) + số trực tiếp
      const s = BY.THAMNN.so_lieu[c.ma] || {}, d = tt[c.ma] || {};
      const E = (s.thuc_hien == null && d.thuc_hien == null) ? null : N(s.thuc_hien) + N(d.thuc_hien);
      const F = (s.ke_hoach_nam == null && d.ke_hoach_nam == null) ? null : N(s.ke_hoach_nam) + N(d.ke_hoach_nam);
      let J = null, V = null;
      if (c.cong_len_nhom) {
        J = ev.reduce((a, e) => a + N(e.rows[i].J), 0) + N(bs[c.ma]);
        V = ev.reduce((a, e) => a + N(e.rows[i].V), 0) + N(bs[c.ma]);
      }
      return row(c, w('THAMNN', c.ma), E, F, J, V);
    });
    return { ma: 'THAMNN', rows, t: totals(rows) };
  }

  // Bảng tổng hợp 10 dòng
  function summary(plans) {
    const cache = {};
    const ph = evalPhong(plans, cache);
    const order = ['THAMNN', 'HUYENHLL', 'NAM.DOHOAI', ...PERSONAL];
    const list = order.map(m => m === 'THAMNN' ? ph : (cache[m] || (cache[m] = GROUPS.includes(m) ? evalGroup(m, plans, cache) : evalPersonal(m, plans))));
    return { list, cache };
  }

  // ---- Màn hình cá nhân: Gợi ý A, B, tỷ lệ áp dụng ----
  function suggestA(c, r) {
    if (r.w == null) return null;
    if (isBinaryLike(c)) return r.F == null ? null : 1;
    if (r.G == null) return null;
    if (c.loai === 'flow' || c.loai === 'bq') return Math.min(c.ty_le_toi_da, Math.max(0, r.G * 4 / 3));
    if (c.loai === 'level') return Math.min(c.ty_le_toi_da, Math.max(0, r.G));
    return Math.min(c.ty_le_toi_da, Math.max(0, r.G));
  }

  function plan(ma, target, rates) {
    const base = evalPersonal(ma, null);
    rates = rates || {};
    const rs = base.rows.map(r => {
      const c = r.ct, pA = suggestA(c, r), p = pA == null ? 0 : pA;
      const o = { ct: c, w: r.w, cap: r.cap, E: r.E, F: r.F, G: r.G, H: r.H, pA, p };
      if (r.w != null) {
        o.hA = r.w * Math.max(0, Math.min(r.cap, 1) - p);
        o.hB = r.w * (r.cap - Math.max(p, 1));
      } else { o.hA = 0; o.hB = 0; }
      return o;
    });
    const SA = rs.reduce((a, o) => a + (o.w == null ? 0 : o.w * o.p), 0);
    const HA = rs.reduce((a, o) => a + o.hA, 0), HB = rs.reduce((a, o) => a + o.hB, 0);
    const maxScore = rs.reduce((a, o) => a + (o.w == null ? 0 : o.w * o.cap), 0);
    const hasT = isNum(target);
    const thieu = hasT ? target - SA : 0;
    const kA = HA === 0 ? 0 : clamp(thieu / HA, 0, 1);
    const kB = HB === 0 ? 0 : clamp((thieu - kA * HA) / HB, 0, 1);
    let SB = 0, SX = 0;
    rs.forEach(o => {
      const c = o.ct;
      o.pB = (o.w == null || !hasT) ? null : o.p + kA * Math.max(0, Math.min(o.cap, 1) - o.p) + kB * (o.cap - Math.max(o.p, 1));
      if (o.pB != null) SB += o.w * Math.max(0, Math.min(o.cap, o.pB));
      // tỷ lệ áp dụng
      const inp = rates[c.ma];
      o.entered = isNum(inp);
      o.clamped = o.entered && (inp > o.cap || inp < 0);
      if (o.w == null) o.S = null;
      else if (o.entered) o.S = Math.min(o.cap, Math.max(0, inp));
      else if (isBinaryLike(c)) o.S = o.G == null ? null : Math.min(o.cap, Math.max(0, o.G));
      else o.S = o.pA;
      o.T = (o.S == null || o.F == null) ? null : o.S * o.F;
      o.U = o.T == null ? null : o.T - N(o.E);
      o.X = (o.w == null || o.S == null) ? null : o.w * Math.max(0, Math.min(o.cap, o.S));
      o.Y = o.X == null ? null : o.X - N(o.H);
      o.todo = null; o.todoUnit = '';
      if (o.U != null) {
        if (c.loai === 'flow') { o.todo = Math.max(0, o.U) / 3; o.todoUnit = c.dvt.toLowerCase() + '/tháng (bình quân Q4)'; }
        else if (c.loai === 'bq') { o.todo = 4 * o.U; o.todoUnit = 'tỷ: số dư BQ Q4 cao hơn BQ 9 tháng'; }
        else if (c.ma === 'dmst') { o.todo = Math.max(0, o.U); o.todoUnit = 'sáng kiến đăng ký trên SMP'; }
        else if (c.loai === 'level') { o.todo = Math.max(0, o.U); o.todoUnit = (c.ma === 'tdqt' ? 'thẻ/KH' : 'KH') + ' tăng thêm đến 31/12'; }
        else if (c.loai === 'binary') { o.todo = o.S >= 1 ? 1 : 0; o.todoUnit = 'đảm bảo đạt (1 = đạt)'; }
      }
      o.kt = feasibility(o);
      if (o.X != null) SX += o.X;
    });
    let status = '';
    if (!hasT) status = 'Hãy nhập mục tiêu điểm KPI năm 2026 để nhận Gợi ý B.';
    else if (target > maxScore) status = `Mục tiêu vượt điểm tối đa có thể đạt (${fmt(maxScore, 1)} điểm). Hãy điều chỉnh mục tiêu.`;
    else if (SX >= target - 1e-9) status = 'Kế hoạch đã đạt mục tiêu';
    else status = `Còn thiếu ${fmt(target - SX, 1)} điểm – nâng tỷ lệ ở chỉ tiêu có Gợi ý B cao hơn tỷ lệ đang chọn`;
    return { ma, rows: rs, SA, SB: hasT ? SB : null, SX, maxScore, H: base.t.H, wData: base.t.wData, kA, kB, target: hasT ? target : null, status, base };
  }

  function feasibility(o) {
    const c = o.ct;
    if (o.w == null) return '';
    if (isBinaryLike(c)) return o.S == null ? '' : (N(o.E) >= N(o.T) ? 'Đã đạt – duy trì' : 'Cần đảm bảo hoàn thành');
    if (o.U == null) return '';
    if (o.U <= 0) return N(o.G) >= 1 ? 'Đã đạt – duy trì' : 'Giữ nguyên – chưa đạt KH';
    if (c.loai === 'level') {
      if (o.U <= 0.1 * o.F) return 'Trong tầm tay (GAP ≤ 10% KH)';
      if (o.U <= 0.3 * o.F) return 'Cần tăng tốc (GAP ≤ 30% KH)';
      return 'Thách thức lớn (GAP > 30% KH)';
    }
    if (N(o.E) <= 0) return 'Thách thức lớn (đang âm/0)';
    if (o.U <= o.E / 3) return 'Trong tầm tay (≤ tốc độ 9 tháng)';
    if (o.U <= 2 * o.E / 3) return 'Cần tăng tốc (≤ 2× tốc độ)';
    return 'Thách thức lớn (> 2× tốc độ)';
  }

  // ---- Quy đổi số tuyệt đối → tỷ lệ HT dự kiến ----
  // abs = số dự kiến tăng thêm đến 31/12 (dòng: phát sinh Q4; bình quân: Delta BQ năm tăng thêm; số lượng: KH tăng thêm)
  function rateFromAbs(ma, ctMa, abs) {
    const s = BY[ma].so_lieu[ctMa] || {};
    if (!isNum(abs) || !s.ke_hoach_nam) return null;
    return (N(s.thuc_hien) + abs) / s.ke_hoach_nam;
  }
  const absFromRate = (ma, ctMa, p) => { const s = BY[ma].so_lieu[ctMa] || {}; return (!isNum(p) || !s.ke_hoach_nam) ? null : p * s.ke_hoach_nam - N(s.thuc_hien); };
  // Dự phóng BQ năm = (BQ đến T10 × 10 + Dư cuối T10 + Dư cuối T11) / 12; Delta = BQ năm dự kiến − nền BQ đến 31/10/2025
  function projectBQ(ma, ctMa, inp) {
    const s = BY[ma].so_lieu[ctMa] || {}, nen = ((D.nen_bq || {})[ma] || {})[ctMa];
    const ok = inp && isNum(inp.bq10) && isNum(inp.c10) && isNum(inp.c11);
    const bqNam = ok ? (inp.bq10 * 10 + inp.c10 + inp.c11) / 12 : null;
    const delta = (bqNam != null && isNum(nen)) ? bqNam - nen : null;
    const rate = (delta != null && s.ke_hoach_nam) ? delta / s.ke_hoach_nam : null;
    return { nen: isNum(nen) ? nen : null, bqNam, delta, rate, tang: delta == null ? null : delta - N(s.thuc_hien) };
  }

  // ---- Theo dõi thực hiện: số mới nhất tại cuối tháng m (10, 11, 12) ----
  // base: [{ct, w, cap, E (30/9), F, T (kết quả cần đạt theo kế hoạch)}]; vals: {ct: số thực hiện mới nhất}
  function track(base, vals, m) {
    const left = 12 - m;
    const rows = base.map(b => {
      const c = b.ct, o = { ...b, Em: isNum(vals[c.ma]) ? vals[c.ma] : null };
      const Eu = o.Em != null ? o.Em : b.E; // chưa nhập: dùng số 30/9
      o.Eu = Eu;
      if (!b.F) return o;
      const sc = p => b.w == null || p == null ? null : b.w * Math.max(0, Math.min(b.cap, p));
      o.Gm = Eu == null ? null : Eu / b.F; o.Hm = sc(o.Gm);
      o.gap100 = Math.max(0, b.F - N(Eu));
      o.gapPlan = isNum(b.T) ? b.T - N(Eu) : null;
      // giữ tốc độ mới: dòng/bình quân ×12/m; số lượng, đạt/không đạt giữ nguyên
      const mm = o.Em != null ? m : 9; // chưa có số mới: giữ tốc độ 9 tháng
      o.pPace = Eu == null ? null : ((c.loai === 'flow' || c.loai === 'bq') ? Math.max(0, Eu) * 12 / mm : Eu) / b.F;
      o.Xpace = sc(o.pPace);
      o.Xplan = isNum(b.T) ? sc(b.T / b.F) : null;
      if (left > 0 && isNum(o.gapPlan)) {
        if (c.loai === 'flow') { o.todo = Math.max(0, o.gapPlan) / left; o.todoUnit = c.dvt.toLowerCase() + '/tháng'; }
        else if (c.loai === 'bq') { o.todo = 12 * o.gapPlan / left; o.todoUnit = 'tỷ: số dư BQ ' + (left === 1 ? 'tháng 12' : 'các tháng còn lại') + ' cao hơn BQ lũy kế'; }
        else if (c.loai === 'level') { o.todo = Math.max(0, o.gapPlan); o.todoUnit = 'tăng thêm đến 31/12'; }
      }
      // tiến độ đóng GAP Q4 so với kế hoạch: (Em − E30/9) / (T − E30/9)
      if (o.Em != null && isNum(b.T) && isNum(b.E) && b.T - b.E > 1e-9) o.progress = (o.Em - b.E) / (b.T - b.E);
      return o;
    });
    const sum = k => rows.reduce((a, o) => a + (o.w == null ? 0 : N(o[k])), 0);
    return { rows, m, left, Hm: sum('Hm'), Xpace: sum('Xpace'), Xplan: sum('Xplan'), nEntered: rows.filter(o => o.w != null && o.Em != null).length };
  }

  function fmt(x, d = 2) {
    if (!isNum(x)) return '–';
    return x.toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  return { setRule: r => { RULE = r; }, get RULE() { return RULE; }, setSoLieu, track, TRACK_ONLY, GROUP_RULE, ALLCB, init, rateFromAbs, absFromRate, projectBQ, evalPersonal, evalGroup, evalPhong, summary, plan, fmt, PERSONAL, GROUPS, groupOf, get CT() { return CT; }, get BY() { return BY; }, isNum, N };
})();

<script>
window.__startApp = function(){
KPI.init(SEED);
const $ = s => document.querySelector(s);
const app = $('#app');
const f = KPI.fmt, N = KPI.N, isNum = KPI.isNum;
const pct = (x, d = 1) => isNum(x) ? f(x * 100, d) + '%' : '–';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BY = KPI.BY, CT = KPI.CT;
const LEADERS = { 'HUYENHLL': 'Lãnh đạo nhóm', 'NAM.DOHOAI': 'Lãnh đạo nhóm', 'THAMNN': 'Lãnh đạo Phòng' };
const STATUS = { nhap: ['Đang lập', 'y'], da_gui: ['Đã gửi duyệt', 'b'], da_duyet: ['Đã duyệt', 'g'] };
const dvt = c => c.dvt === 'Đạt=1' ? '' : c.dvt.toLowerCase();
const fnum = (c, x) => { if (!isNum(x)) return '–'; const d = c.dvt === 'Tỷ đồng' ? 2 : (c.dvt === 'Triệu đồng' ? 1 : 0); return f(x, d); };
const shortName = c => c.ten.replace(/\s*\(.*?\)\s*/g, ' ').replace('bình quân tăng trưởng trong năm', 'BQ tăng trưởng').trim();

/* ---------- state ---------- */
const S = { me: null, plans: {}, pins: {}, solieu: {}, track: {}, trkKy: {}, db: null, step: 1, draft: null, view: 'sum', detail: null, sumMode: 'plan', saving: null };
const KY = { 10: '31/10/2026', 11: '30/11/2026', 12: '31/12/2026' };
const TRACK_ONLY = KPI.TRACK_ONLY;
// đang gõ trong ô nhập → không vẽ lại cả trang khi có cập nhật từ kho chung

const setSync = (txt, cls) => { const el = $('#sync'); el.textContent = txt; el.className = 'sync ' + (cls || ''); };
async function connect() {
  let db = null;
  try { db = await (window.claude && window.claude.use ? window.claude.use('db') : null); } catch (e) { db = null; }
  if (!db) { setSync('Chưa kết nối kho chung – kế hoạch chỉ tạm trong phiên này', 'err'); render(); return; }
  S.db = db;
  db.collection('plans').onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => { if (d.exists) p[d.id] = d.data(); });
    S.plans = p; S.loaded = true;
    if (window.KPI_LOCAL_MODE && window.KPI_LOCAL_MODE()) setSync('Lưu trên máy này – chưa nối kho chung', 'err'); else setSync('Đã đồng bộ kho chung của Phòng', 'ok');
    if (S.me && S.draft && p[S.me]) S.draft.status = p[S.me].status || S.draft.status;
    const editing = isEditingNow() || (S.me && KPI.PERSONAL.includes(S.me) && S.view !== 'sum' && (S.step === 2 || S.step === 3));
    if (!S.initRendered || !editing) { S.initRendered = true; render(); }
  }, e => setSync('Mất kết nối kho chung (' + e.code + ')', 'err'));
  db.collection('so_lieu').onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => { if (d.exists) p[d.id] = d.data(); });
    S.solieu = p; applySoLieu();
    if (!isEditingNow()) render();
  }, () => {});
  db.collection('thuc_hien').onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => { if (d.exists) p[d.id] = d.data(); });
    S.track = p;
    if (!isEditingNow()) render();
  }, () => {});
  db.collection('pins').onSnapshot(snap => { const p = {}; snap.docs.forEach(d => { if (d.exists) p[d.id] = d.data(); }); S.pins = p; S.pinsLoaded = true; if (!S.me) render(); }, () => {});
}
async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const ch of s) h = (h * 33 ^ ch.charCodeAt(0)) >>> 0; return 'd' + h.toString(16); }
}

  if (!S.db) { S.plans[ma] = { ...(S.plans[ma] || {}), ...body }; S.dirty = false; setSync('Chưa kết nối kho chung – kế hoạch chỉ tạm trong phiên này', 'err'); return; }

    S.dirty = false; setSync('Đã lưu ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), 'ok');
  } catch (e) { setSync('Lưu chưa được (' + (e.code || 'lỗi') + ') – thử lại', 'err'); }

/* tỷ lệ HT từ chế độ nhập: 'pct' (tỷ lệ), 'abs' (số tuyệt đối tăng thêm), 'bq' (dự phóng số dư – Dư nợ, Nguồn vốn) */

function bindTrack(ma) {
  const box = app.querySelector(`[data-trk="${CSS.escape(ma)}"]`); if (!box) return;
  const m = trkKyOf(ma);
  box.querySelectorAll('[data-ky]').forEach(b => b.onclick = () => { S.trkKy[ma] = +b.dataset.ky; render(); });
  const recompute = () => {
    const base = trackBase(ma), tr = KPI.track(base, trkVals(ma, m), m), hasW = base.some(b => b.w != null);
    box.querySelector('[data-stats]').innerHTML = trackStats(tr, hasW, m);
    tr.rows.forEach(o => { const tr2 = box.querySelector(`tr[data-ct="${o.ct.ma}"]`); if (!tr2) return; const k = trackCells(o); tr2.querySelectorAll('[data-k]').forEach(td => td.innerHTML = k[td.dataset.k]); });
  };
  box.querySelectorAll('[data-tin]').forEach(i => i.oninput = () => {
    S.trkDraft = S.trkDraft || {}; S.trkDraft[ma] = S.trkDraft[ma] || {};
    const cur = S.trkDraft[ma][m] || (S.trkDraft[ma][m] = { ...trkVals(ma, m) });
    if (i.value === '') { delete cur[i.dataset.tin]; i.classList.remove('entered'); } else { cur[i.dataset.tin] = +i.value; i.classList.add('entered'); }
    recompute();
    debounce('trk' + ma, async () => {
      const doc = S.track[ma] || {}, ky = { ...(doc.ky || {}) };
      ky[m] = { values: S.trkDraft[ma][m], updatedAt: new Date().toISOString(), by: S.me };
      const body = { latest: Math.max(m, ...Object.keys(ky).filter(k => Object.keys(ky[k].values || {}).length).map(Number)), ky, updatedAt: new Date().toISOString(), by: S.me };
      S.track[ma] = body;
      await saveDoc('thuc_hien/' + ma, body);
    });
  });
}

    <div class="note small">Ba bước: <b>1.</b> nhập Thực hiện 30/9 và Kế hoạch năm các chỉ tiêu được giao, đúng như file cập nhật kết quả 9 tháng (chỉ tiêu không được giao để trống) → <b>2.</b> nhập số dự kiến tăng thêm trong Q4 → <b>3.</b> hằng tháng nhập số thực hiện mới nhất để theo dõi.</div>
    <section class="panel" style="display:flex;flex-direction:column;gap:10px"><h2>1. Số liệu 9 tháng được giao</h2>
      <div class="tw"><table><thead><tr><th>Chỉ tiêu</th><th>ĐVT</th><th class="n">Thực hiện 30/9</th><th class="n">Kế hoạch năm</th><th class="n">%HT 30/9</th></tr></thead><tbody>
      ${rowsCT.map(c => { const s = BY[ma].so_lieu[c.ma] || {}; return `<tr data-ct="${c.ma}"><td class="ctn">${esc(shortName(c))}</td><td class="small muted">${esc(c.dvt)}</td>
        <td class="n"><input type="number" step="any" inputmode="decimal" class="tin${isNum(s.thuc_hien) ? ' entered' : ''}" data-sl="thuc_hien" value="${isNum(s.thuc_hien) ? s.thuc_hien : ''}" aria-label="Thực hiện ${esc(shortName(c))}"></td>
        <td class="n"><input type="number" step="any" inputmode="decimal" class="tin${isNum(s.ke_hoach_nam) ? ' entered' : ''}" data-sl="ke_hoach_nam" value="${isNum(s.ke_hoach_nam) ? s.ke_hoach_nam : ''}" aria-label="Kế hoạch năm ${esc(shortName(c))}"></td>
        <td class="n" data-g>${tdPct(ma, c)}</td></tr>`; }).join('')}
      </tbody></table></div></section>
    <section class="panel" id="tdPlan" style="display:flex;flex-direction:column;gap:10px">${tdPlanHtml(ma)}</section>
    <div id="tdTrack">${trackBlock(ma, true)}</div>`;
  app.querySelectorAll('[data-sl]').forEach(i => i.oninput = () => {
    const ct = i.closest('tr').dataset.ct, v = i.value === '' ? null : +i.value;
    KPI.setSoLieu(ma, ct, { [i.dataset.sl]: v }); i.classList.toggle('entered', v != null);
    i.closest('tr').querySelector('[data-g]').innerHTML = tdPct(ma, CT.find(c => c.ma === ct));
    // tỷ lệ đã quy từ số tăng thêm phụ thuộc KH → tính lại
    Object.keys(S.draft.abs || {}).forEach(k => { const r = KPI.rateFromAbs(ma, k, S.draft.abs[k]); if (isNum(r)) S.draft.rates[k] = r; else delete S.draft.rates[k]; });
    refreshTd(ma);
    debounce('sl' + ma, async () => {
      const values = {}; Object.entries(BY[ma].so_lieu).forEach(([k, s]) => { if (isNum(s.thuc_hien) || isNum(s.ke_hoach_nam)) values[k] = { thuc_hien: s.thuc_hien ?? null, ke_hoach_nam: s.ke_hoach_nam ?? null }; });
      S.solieu[ma] = { values, updatedAt: new Date().toISOString(), by: S.me };
      await saveDoc('so_lieu/' + ma, S.solieu[ma]); savePlan();
    });
  });
  bindTdPlan(ma); bindTrack(ma);
}
const tdPct = (ma, c) => { const s = BY[ma].so_lieu[c.ma] || {}; return s.ke_hoach_nam ? `<span class="pill ${colorOf(N(s.thuc_hien) / s.ke_hoach_nam)}">${pct(N(s.thuc_hien) / s.ke_hoach_nam)}</span>` : '<span class="muted small">không giao</span>'; };
function tdPlanHtml(ma) {
  const rows = CT.filter(c => c.cong_len_nhom && c.loai !== 'binary' && (BY[ma].so_lieu[c.ma] || {}).ke_hoach_nam);
  if (!rows.length) return '<h2>2. Kế hoạch Q4</h2><p class="muted small">Nhập Kế hoạch năm ở bước 1 để lập kế hoạch Q4.</p>';
  const ev = KPI.evalPersonal(ma, { [ma]: { rates: S.draft.rates } });
  return `<h2>2. Kế hoạch Q4</h2><p class="small muted">Nhập số dự kiến tăng thêm đến 31/12 (để trống: tạm tính theo tốc độ 9 tháng).</p>
    <div class="tw"><table><thead><tr><th>Chỉ tiêu</th><th class="n">Dự kiến tăng thêm</th><th>Đơn vị</th><th class="n">Kết quả cần đạt</th><th class="n">%HT dự kiến</th></tr></thead><tbody>
    ${rows.map(c => { const r = ev.rows.find(x => x.ct.ma === c.ma), a = S.draft.abs[c.ma]; return `<tr data-ct="${c.ma}"><td class="ctn">${esc(shortName(c))}</td>
      <td class="n"><input type="number" step="any" inputmode="decimal" class="tin${isNum(a) ? ' entered' : ''}" data-tabs value="${isNum(a) ? a : ''}" placeholder="${isNum(r.J) ? +r.J.toFixed(2) : ''}" aria-label="Dự kiến tăng thêm ${esc(shortName(c))}"></td>
      <td class="small muted">${esc(ABS_UNIT(c))}</td><td class="n" data-t>${fnum(c, N(r.E) + N(r.J))}</td><td class="n" data-k>${pct(r.K)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function bindTdPlan(ma) {
  app.querySelectorAll('[data-tabs]').forEach(i => i.oninput = () => {
    const ct = i.closest('tr').dataset.ct;
    if (i.value === '') { delete S.draft.abs[ct]; delete S.draft.rates[ct]; delete S.draft.mode[ct]; i.classList.remove('entered'); }
    else { S.draft.abs[ct] = +i.value; S.draft.mode[ct] = 'abs'; const r = KPI.rateFromAbs(ma, ct, +i.value); if (isNum(r)) S.draft.rates[ct] = r; i.classList.add('entered'); }
    const r = KPI.evalPersonal(ma, { [ma]: { rates: S.draft.rates } }).rows.find(x => x.ct.ma === ct);
    i.closest('tr').querySelector('[data-t]').textContent = fnum(r.ct, N(r.E) + N(r.J)); i.closest('tr').querySelector('[data-k]').textContent = pct(r.K);
    queueSave(); $('#tdTrack').innerHTML = trackBlock(ma, true); bindTrack(ma);
  });
}
function refreshTd(ma) { $('#tdPlan').innerHTML = tdPlanHtml(ma); bindTdPlan(ma); $('#tdTrack').innerHTML = trackBlock(ma, true); bindTrack(ma); }

const stTxt = pl => { const s = STATUS[pl.status || 'nhap']; return pl.updatedAt ? `<span class="pill ${s[1]}">${s[0]}</span><span class="muted">cập nhật ${new Date(pl.updatedAt).toLocaleString('vi-VN')}</span>` : '<span class="pill n">Chưa lập</span>'; };

/* ---------- ca kiểm thử mục 9 (chạy trong trình duyệt) ---------- */
function runTests() {
  const T = SEED.kiem_thu, exp = T.tong_hop;
  // đối chiếu theo đúng cách cộng của file Excel gốc (mục 9), trên số liệu gốc
  const keepNii = { ...BY.HUYENHLL.so_lieu.nii }; KPI.setSoLieu('HUYENHLL', 'nii', SEED_SL.HUYENHLL.nii); KPI.setRule('excel');
  const s = KPI.summary({}); let ok = 0, tot = 0; const bad = [];
  const ck = (n, g, x, tol = 0.006) => { tot++; if (Math.abs(g - x) <= tol) ok++; else bad.push(n + ': ' + f(g) + ' ≠ ' + f(x)); };
  s.list.forEach(e => { const x = exp[e.ma]; ck(e.ma + ' điểm 30/9', e.t.H, x[0]); ck(e.ma + ' TS', e.t.wData, x[1], 0); ck(e.ma + ' giữ tốc độ', e.t.L, x[2]); ck(e.ma + ' đề xuất', e.t.X, x[3]); });
  const rates = { casa: .3, manu: .5, phibv: 2.5 }, p = KPI.plan('THUANNH', 80, rates), r = m => p.rows.find(o => o.ct.ma === m);
  ck('Gợi ý A', p.SA, T.thuannh.A); ck('Gợi ý B', p.SB, T.thuannh.B); ck('Tỷ lệ chọn', p.SX, T.thuannh.chon);
  T.thuannh.goi_y_b.forEach(([m, v]) => ck('B ' + m, r(m).pB * 100, v, .06));
  ck('CASA GAP', r('casa').U, T.thuannh.casa_gap); ck('CASA BQ Q4', r('casa').todo, T.thuannh.casa_bq);
  ck('KPI Phòng sau KH THUANNH', KPI.summary({ THUANNH: { rates } }).list[0].t.L, T.thuannh.phong_sau);
  KPI.setRule('moi'); KPI.setSoLieu('HUYENHLL', 'nii', keepNii);
  const sm = KPI.summary({}).list[0]; ck('Cách cộng mới: Phòng 30/9', sm.t.H, exp.THAMNN[0]); ck('Cách cộng mới: Phòng giữ tốc độ', sm.t.L, exp.THAMNN[2], .05);
  $('#testOut').innerHTML = `<div class="${bad.length ? 'warnbox' : 'note'}"><b>${ok}/${tot} phép kiểm khớp</b> với mục 9 (10 dòng tổng hợp × 4 chỉ số, ca THUANNH mục tiêu 80: Gợi ý A/B, tỷ lệ chọn, 7 tỷ lệ Gợi ý B, CASA, KPI Phòng sau kế hoạch) theo cách cộng của file Excel gốc, và số Phòng theo cách cộng nhóm mới. Chạy trên số liệu gốc, không ảnh hưởng kế hoạch đã lưu.${bad.length ? '<br>' + bad.map(esc).join('<br>') : ''}</div>`;
}


/* điện thoại: gắn nhãn cột cho từng ô để bảng hiển thị dạng thẻ */
function cardify(root) {
  (root || document).querySelectorAll('.tw table').forEach(t => {
    const ths = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/\s+/g, ' ').trim());
    if (!ths.length) return;
    t.classList.add('cf');
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => { let i = 0; [...tr.children].forEach(td => { const span = +td.getAttribute('colspan') || 1; if (!td.hasAttribute('data-l')) td.setAttribute('data-l', ths[i] || ''); i += span; }); });
  });
}
new MutationObserver(() => cardify(app)).observe(app, { childList: true, subtree: true });
addEventListener('beforeunload', () => { if (S.dirty) savePlan(); });
if (S.pendingMe) { S.me = S.pendingMe; S.draft = mkDraft(S.me); S.view = KPI.PERSONAL.includes(S.me) ? 'me' : 'sum'; }
render();
connect();
};
