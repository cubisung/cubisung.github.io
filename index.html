<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a47">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Theo dõi phí">
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Quản lý phí</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--surface-2:#f6f8fb;--ink:#0f1b2d;--muted:#5f6e82;--line:#e1e7ef;--band:#0e2a47;--band-2:#14385e;--band-muted:#a9bdd6;--accent:#0a8f6a;--accent-soft:#e2f4ee;--danger:#c0392b;--danger-soft:#fdecea;--warn:#b7791f;--warn-soft:#fff5dc;--ok:#19a974;--red:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0b121c;--surface:#121c29;--surface-2:#0f1824;--ink:#e6edf6;--muted:#93a3b8;--line:#223146;--band:#0f2238;--band-2:#16304d;--accent:#34c79a;--accent-soft:#143a30;--danger:#f08a7e;--danger-soft:#3a1d1a;--warn:#f0c060;--warn-soft:#3a2f12}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--ink)}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,var(--band),var(--band-2))}
.lcard{background:var(--surface);border-radius:16px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px #0006}
.lcard h1{margin:0 0 4px;font-size:22px}.lcard p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:12px}.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btn.full{width:100%;margin-top:18px;padding:12px}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--band);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 18px;font-weight:700;font-size:16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.logoimg{width:40px;height:40px;object-fit:contain;flex:none}.logoimg.big{width:92px;height:92px;display:block;margin:0 auto 10px}
nav{overflow:auto}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--band-muted);padding:11px 12px;border-radius:10px;text-align:left;font-weight:500;margin-bottom:2px}
nav button:hover{background:#ffffff14;color:#fff}
nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav svg{width:18px;height:18px;flex:none}
.me{margin-top:auto;padding:12px;background:#ffffff12;border-radius:12px;font-size:13px}
.me small{color:var(--band-muted);display:block}.me button{margin-top:8px;background:none;border:1px solid #ffffff40;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.top h2{margin:0;font-size:22px}.top p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools select,.tools input{width:auto}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 12px;font-size:15px}
.kpi small{display:block;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:26px;margin:4px 0 2px}.kpi span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.low i{background:var(--red)}.bar.mid i{background:#e5a100}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;position:relative;min-width:8px;opacity:.9}
.chart div:hover{opacity:1}.chart span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.chart div.today{background:#e5a100}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:normal;vertical-align:bottom}
td.r,th.r{text-align:right}tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:700;background:var(--surface-2)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
.scroll table td,.scroll table th{border-right:1px solid var(--line)}
.sep{border-left:3px solid var(--line)!important}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2)}
.pill.g{background:var(--accent-soft);color:var(--accent)}.pill.r{background:var(--danger-soft);color:var(--danger)}.pill.y{background:var(--warn-soft);color:var(--warn)}
.pct{font-weight:700}.pct.low{color:var(--red)}.pct.mid{color:#c68a00}.pct.hi{color:var(--accent)}
.mx td,.mx th{padding:0;text-align:center;min-width:34px;height:34px;font-size:11px}
.mx th.nm,.mx td.nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px;min-width:210px;font-size:13px}
.mx th.nm{background:var(--surface-2);z-index:3}
.mx tr.dep td{background:var(--surface-2);font-weight:700;font-size:12px;text-align:left;padding:6px 10px;cursor:pointer;color:var(--accent)}
.mx td.s{width:34px}.mx .c{display:block;margin:3px;height:26px;border-radius:6px;cursor:pointer}
.c.ok{background:var(--ok)}.c.no{background:#fff;border:1px solid var(--line)}.c.miss{background:var(--red)}.c.pend{background:var(--warn-soft);border:2px dashed #e5a100}.c.off{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,var(--line) 4px,var(--line) 5px)}.c.fut{background:transparent}.c.idle{background:var(--surface-2);border:1px solid var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.mx td.t{min-width:64px;font-weight:700;font-size:12px;background:var(--surface)}
.pi{width:130px;text-align:right;padding:6px 8px}
.feegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feegrid div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.feegrid label{margin:0 0 4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px #0005;z-index:99;max-width:92vw}
.note{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.seg{display:inline-flex;gap:6px}
#busy{position:fixed;inset:0;background:#0b121caa;display:grid;place-items:center;color:#fff;z-index:90}
dialog{border:0;border-radius:14px;padding:22px;max-width:380px;width:92%}dialog::backdrop{background:#0008}
.pw{display:flex;align-items:center;gap:8px;justify-content:flex-end}.pw .bar{width:80px;flex:none}
.ofc td.kk,.ofc th.kk{background:var(--accent-soft)}.ofc tr.tot td.kk{background:var(--accent-soft)}
.ofc.det th.k1,.ofc.det td.k1{min-width:38px;width:38px;position:sticky;left:0;z-index:2;background:var(--surface)}
.ofc.det th.k2,.ofc.det td.k2{min-width:190px;width:190px;max-width:190px;position:sticky;left:38px;z-index:2;background:var(--surface)}
.ofc.det th.kk1,.ofc.det td.kk1{min-width:112px;width:112px;position:sticky;left:228px;z-index:2}
.ofc.det th.kk2,.ofc.det td.kk2{min-width:112px;width:112px;position:sticky;left:340px;z-index:2}
.ofc.det th.kk3,.ofc.det td.kk3{min-width:92px;width:92px;position:sticky;left:452px;z-index:2;border-right:3px solid var(--accent)}
.ofc.det th.k1,.ofc.det th.k2,.ofc.det th.kk1,.ofc.det th.kk2,.ofc.det th.kk3{z-index:3}
.ofc.det th.k1,.ofc.det th.k2{background:var(--surface-2)}
.ofc.det tr.tot td.k1,.ofc.det tr.tot td.k2{background:var(--surface-2)}
.ofc.det .pw{justify-content:flex-end}
@media(max-width:860px){.ofc.det th.kk,.ofc.det td.kk{position:static}.ofc.det th.k2,.ofc.det td.k2{min-width:130px;width:130px;max-width:130px}.ofc.det th.kk3,.ofc.det td.kk3{border-right:0}}
@media(max-width:860px){.pw .bar{width:44px}}
tr.grp td{background:var(--accent-soft);color:var(--ink);text-align:left;padding:8px 10px;border-top:2px solid var(--accent);white-space:normal}tr.grp td b{color:var(--accent)}
@media(max-width:860px){
 #app{display:block}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:50}
 .brand,.me{display:none}nav{display:flex;width:100%;justify-content:space-between;overflow-x:auto}
 nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;text-align:center;width:auto;box-shadow:none!important;white-space:nowrap}
 main{padding:16px 14px 90px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.feegrid{grid-template-columns:1fr 1fr}
 .mobile-out{display:block!important}
}
.mobile-out{display:none;margin-top:8px}
</style>
</head>
<body>
<div id="login">
 <form class="lcard" onsubmit="doLogin();return false">
  <img class="logoimg big" src="assets/logo.png" alt="Logo Theo dõi phí">
  <h1 style="text-align:center">Quản lý phí</h1>
  <p style="text-align:center">Đăng nhập bằng User AD và mã PIN</p>
  <label>User AD</label><input id="lad" autocomplete="username" autocapitalize="characters" placeholder="VD: THAMNN">
  <label>Mã PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6 chữ số">
  <button class="btn full" id="lbtn">Đăng nhập</button>
  <div id="lerr" class="hide" style="color:var(--danger);margin-top:10px"></div>
 </form>
</div>

<div id="app" class="hide">
 <aside>
  <div class="brand"><img class="logoimg" src="assets/logo.png" alt="Logo Theo dõi phí"> Quản lý phí</div>
  <nav id="nav"></nav>
  <div class="me"><b id="meName"></b><small id="meRole"></small><button onclick="logout()">Đăng xuất</button></div>
 </aside>
 <main id="main"></main>
</div>
<button class="btn ghost mobile-out hide" id="mout" onclick="logout()" style="position:fixed;top:8px;right:8px;z-index:60;padding:4px 10px;font-size:12px">Đăng xuất</button>
<div id="toast" class="toast hide"></div>
<div id="busy" class="hide">Đang tải dữ liệu…</div>
<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:14px"><button class="btn" onclick="document.getElementById('dlg').close()">Đóng</button></div></dialog>

<script>
/* ================= CẤU HÌNH ================= */
var API_URL=(function(){var d='https://script.google.com/macros/s/AKfycbxmuWSJnQ0JmY5tQ_S_D9-wJAJ7h23-PZTNQdRe_lQRrn8DOwj0AhvTr5fvFmWDhWHz/exec';
 try{var q=new URLSearchParams(location.search).get('db');if(q&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(q)){localStorage.setItem('qlp2-api',q);return q}var s=localStorage.getItem('qlp2-api');if(s)return s}catch(e){}return d})();
var TKEY='qlp2-token',YEAR=2026,HOLIDAYS=[]; /* ngày lễ dạng 'yyyy-mm-dd' nếu cần loại khỏi ngày làm việc */
var FEES=['Phí trợ lý thẻ','Phí Alias','Phí số đẹp','Phí Gói TK','Phí trả nợ trước hạn','Phí trả góp'],BHS=['Bảo hiểm VBI khoản vay','Bảo hiểm VBI ô tô KHCN','Bảo hiểm VBI ô tô KHDN','Manulife'],GIO_CHOT=16;
var RATES={'Bảo hiểm VBI khoản vay':0.25,'Bảo hiểm VBI ô tô KHCN':0.10,'Bảo hiểm VBI ô tô KHDN':0.05,'Manulife':0.25};
var shortBH=function(n){return n.replace('Bảo hiểm ','')};
var rateOf=function(n){return RATES[n]||0};
var hhOfItems=function(it){return Math.round(sumA(BHS.map(function(n){return (it[n]||0)*rateOf(n)})))};
var DEPS=[['dvkh','Phòng DVKH'],['khdn','Phòng KHDN'],['banle','Phòng Bán lẻ'],['nhanco','PGD Nhân Cơ'],['dakmil','PGD Đăk Mil'],['daklap','PGD Đăk R’lấp'],['cujut','PGD Cư Jút'],['daksong','PGD Đắk Song']];
var ROLE_MAP={canbo:'staff',lanhdao:'head',bgd:'gd',quanly:'admin'};
var ROLE_LABEL={staff:'Cán bộ',head:'Lãnh đạo phòng',gd:'Ban giám đốc / Tổ chức',admin:'Quản trị'};
var POS_LABEL={GDV:'Giao dịch viên',RM:'RM',LD:'Lãnh đạo'};
var WK=['CN','T2','T3','T4','T5','T6','T7'];

/* ================= TIỆN ÍCH ================= */
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return Math.round(n).toLocaleString('vi-VN')};
var tr=function(n){return n>=1e6?(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr':money(n)};
var pct=function(a,b){return b?Math.round(a/b*100):0};
var pcls=function(p){return p<40?'low':p<70?'mid':'hi'};
var bcls=function(p){return p<40?'low':p<70?'mid':''};
var sumA=function(a){return a.reduce(function(x,y){return x+y},0)};
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.add('hide')},2600)}
function vnNow(){var p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return{key:p.year+'-'+p.month+'-'+p.day,hour:+p.hour}}
var pad=function(n){return n<10?'0'+n:''+n};
var ymd=function(m,d){return YEAR+'-'+pad(m)+'-'+pad(d)};
function dim(m){return new Date(YEAR,m,0).getDate()}
function daysOf(m){var a=[];for(var d=1;d<=dim(m);d++){var w=new Date(YEAR,m-1,d).getDay(),k=ymd(m,d);a.push({d:d,w:w,k:k,off:w===0||w===6||HOLIDAYS.indexOf(k)>=0})}return a}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function download(name,text){var b=new Blob(['﻿'+text],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
var csvCell=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

/* ================= DỮ LIỆU & MẠNG ================= */
var me=null,token=null,U=[],OFF=[],SUM={},NIL={},PLANS={},ROWS=[],LOGINS=null,PH={};
var tab='home',filterDep='all',MS=10,loading=false;
function applyRemote(j){
 if(j.cfg){if(j.cfg.loaiPhi)FEES=j.cfg.loaiPhi;if(j.cfg.loaiBH)BHS=j.cfg.loaiBH;if(j.cfg.rates)RATES=j.cfg.rates;if(j.cfg.gioChot)GIO_CHOT=j.cfg.gioChot;PH=j.cfg.phong||{}}
 var pn=function(id){return PH[id]||(DEPS.filter(function(d){return d[0]===id})[0]||[0,'Ban giám đốc / Tổ chức'])[1]};
 U=j.users.map(function(u){return{n:u.name,ad:u.ad,dep:u.dep,depName:u.dep?pn(u.dep):'Ban giám đốc / Tổ chức',role:ROLE_MAP[u.role]||'staff',pos:u.pos}});
 me=U.filter(function(u){return u.ad.toLowerCase()===j.me.ad.toLowerCase()})[0]||{n:j.me.name,ad:j.me.ad,dep:j.me.dep,depName:'Quản trị hệ thống',role:ROLE_MAP[j.me.role]||'staff',pos:j.me.pos};
 OFF=U.filter(function(u){return u.role==='staff'&&u.dep});
 SUM={};(j.sum||[]).forEach(function(r){(SUM[r[0].toUpperCase()]=SUM[r[0].toUpperCase()]||{})[r[1]]=r.slice(2)});
 NIL={};(j.nil||[]).forEach(function(x){(NIL[x.ad.toUpperCase()]=NIL[x.ad.toUpperCase()]||{})[x.date]=1});
 PLANS={};Object.keys(j.plan||{}).forEach(function(k){PLANS[k]=j.plan[k]});
 ROWS=j.rows||[];LOGINS=j.logins||null;
}
function ok(j){return j&&j.ok}
async function fetchData(silent){
 if(!token||loading)return;loading=true;if(!silent)$('busy').classList.remove('hide');
 try{var r=await fetch(API_URL+'?token='+encodeURIComponent(token)+'&t='+Date.now());var j=await r.json();
  if(ok(j)){applyRemote(j);if(!silent||!editing())render()}else if(j&&j.error==='auth'){logout('Phiên đăng nhập hết hạn, vui lòng đăng nhập lại.')}else toast('Không tải được dữ liệu')}
 catch(e){if(!silent)toast('Không kết nối được máy chủ')}
 loading=false;$('busy').classList.add('hide')}
async function post(body){
 $('busy').classList.remove('hide');
 try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,{token:token}))});var j=await r.json();
  if(ok(j)){applyRemote(j);return j}
  if(j&&j.error==='auth'){logout('Phiên đăng nhập hết hạn.');return null}
  toast(({forbidden:'Bạn không có quyền thực hiện thao tác này',plan:'Kế hoạch lũy kế phải tăng dần: T10 ≤ T11 ≤ T12',invalid:'Thông tin chưa hợp lệ (kiểm tra vai trò, phòng, chức danh)',exists:'User AD này đã tồn tại',self:'Không thể đổi vai trò của chính mình',nouser:'Không tìm thấy tài khoản'})[j&&j.error]||'Lưu không thành công');return null}
 catch(e){toast('Không kết nối được máy chủ. Thử lại.');return null}
 finally{$('busy').classList.add('hide')}}
function editing(){var a=document.activeElement;return a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.id!=='lad'&&a.id!=='lpin'}

async function doLogin(){
 var ad=$('lad').value.trim(),pin=$('lpin').value.trim(),er=$('lerr');er.classList.add('hide');
 if(!ad||!pin){er.textContent='Nhập User AD và mã PIN.';er.classList.remove('hide');return}
 $('lbtn').disabled=true;
 try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',ad:ad,pin:pin})});var j=await r.json();
  if(ok(j)&&j.token){token=j.token;try{localStorage.setItem(TKEY,token)}catch(e){}$('lpin').value='';applyRemote(j);start()}
  else{er.textContent='User AD hoặc mã PIN không đúng.';er.classList.remove('hide')}}
 catch(e){er.textContent='Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.';er.classList.remove('hide')}
 $('lbtn').disabled=false}
function logout(msg){token=null;me=null;try{localStorage.removeItem(TKEY)}catch(e){}$('app').classList.add('hide');$('mout').classList.add('hide');$('login').classList.remove('hide');if(msg){$('lerr').textContent=msg;$('lerr').classList.remove('hide')}}
function start(){
 $('login').classList.add('hide');$('app').classList.remove('hide');$('mout').classList.remove('hide');

 var n=vnNow().key,m=+n.slice(5,7);MS=(n.slice(0,4)==YEAR&&m>=10&&m<=12)?m:(n<YEAR+'-10-01'?10:12);
 tab='home';filterDep='all';buildNav();render();window.scrollTo(0,0)}

/* ================= TÍNH TOÁN ================= */
var wide=function(){return me.role==='gd'||me.role==='admin'};
var scopeDeps=function(){return wide()?DEPS.map(function(d){return d[0]}):[me.dep]};
function scopeOff(){return OFF.filter(function(u){return wide()?(filterDep==='all'||u.dep===filterDep):u.dep===me.dep})}
var scopeLabel=function(){return wide()?(filterDep==='all'?'Toàn chi nhánh':(DEPS.filter(function(d){return d[0]===filterDep})[0]||[0,''])[1]):me.depName};
var monthEnd=function(m){return ymd(m,dim(m))};
var Q_START=function(){return YEAR+'-10-01'};
function cell(ad,k){var e=(SUM[ad.toUpperCase()]||{})[k],nf=FEES.length;if(e){var phi=sumA(e.slice(0,nf)),bh=sumA(e.slice(nf));if(phi+bh>0)return{s:'ok',phi:phi+hhArr(e),bh:bh,hh:hhArr(e)}}
 if((NIL[ad.toUpperCase()]||{})[k])return{s:'no',phi:0,bh:0,hh:0};return null}
var hhArr=function(e){return Math.round(sumA(BHS.map(function(n,j){return (e[FEES.length+j]||0)*rateOf(n)})))};
function cumVal(ad,m,fn){var s=SUM[ad.toUpperCase()]||{},end=monthEnd(m),t=0;for(var k in s){if(k>=Q_START()&&k<=end)t+=fn(s[k])}return t}
var cumType=function(ad,m,i){return cumVal(ad,m,function(e){return e[i]||0})};
var cumPhi=function(ad,m){return cumVal(ad,m,function(e){return sumA(e.slice(0,FEES.length))+hhArr(e)})};
var cumBH=function(ad,m,which){return cumVal(ad,m,function(e){return which==null?sumA(e.slice(FEES.length)):(e[FEES.length+which]||0)})};
var cumHH=function(ad,m){return cumVal(ad,m,hhArr)};

var planOf=function(ad,m){var p=PLANS[ad.toUpperCase()];return p?(p[m-10]||0):0};
var workdays=function(m){return daysOf(m).filter(function(x){return !x.off})};
function compliance(ad,m){var t=vnNow().key,w=workdays(m).filter(function(x){return x.k<t&&x.k>=Q_START()});if(!w.length)return null;return pct(w.filter(function(x){return cell(ad,x.k)}).length,w.length)}
var doneToday=function(ad){return !!cell(ad,vnNow().key)};

/* ================= KHUNG GIAO DIỆN ================= */
var IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',enter:'<path d="M12 5v14M5 12h14"/>',book:'<path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/>',plan:'<path d="M4 4h16v16H4zM4 9h16M9 4v16"/>',track:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',rep:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',adm:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function buildNav(){
 var t=[['home','Tổng quan','home']];
 if(me.role==='staff'||me.role==='admin')t.push(['enter','Nhập phí','enter']);

 $('main').innerHTML=f();if(tab==='enter')afterEnter()}
function head(title,sub,tools){return '<div class="top"><div><h2>'+title+'</h2><p>'+sub+'</p></div><div class="tools">'+(tools||'')+'</div></div>'}
function depSel(){return wide()?'<select onchange="filterDep=this.value;render()"><option value="all">Tất cả 8 phòng</option>'+DEPS.map(function(d){return '<option value="'+d[0]+'"'+(filterDep===d[0]?' selected':'')+'>'+d[1]+'</option>'}).join('')+'</select>':''}
function monSel(){return '<select onchange="MS=+this.value;render()">'+[10,11,12].map(function(m){return '<option value="'+m+'"'+(MS===m?' selected':'')+'>Tháng '+m+'/'+YEAR+'</option>'}).join('')+'</select>'}
var upTo=function(){var n=vnNow().key,e=monthEnd(MS);return n<Q_START()?'chưa bắt đầu':(n<e?'cập nhật đến '+n.split('-').reverse().join('/'):'cả tháng '+MS)};

/* ================= 1. TỔNG QUAN ================= */
function vHome(){

 if(me.role==='staff'){
  var a=cumPhi(me.ad,MS),p=planOf(me.ad,MS),c=compliance(me.ad,MS),dn=cell(me.ad,t),

  '<div class="card kpi"><small>Kế hoạch lũy kế T'+MS+'</small><b>'+tr(p)+'</b><span>'+(p?'Lãnh đạo phòng giao':'Chưa có kế hoạch')+'</span></div>'+
  '<div class="card kpi"><small>Hoàn thành</small><b>'+pct(a,p)+'%</b><div class="bar '+bcls(pct(a,p))+'"><i style="width:'+Math.min(100,pct(a,p))+'%"></i></div></div>'+
  '<div class="card kpi"><small>Hôm nay</small><b>'+(dn?(dn.s==='no'?'Không phát sinh':'Đã nhập'):'Chưa nhập')+'</b><span>'+(dn?'Cảm ơn bạn':'Hạn chốt '+GIO_CHOT+':00')+'</span></div></div>'+
  bhCard([me])+
  '<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Phí theo ngày · tháng '+MS+'</h3>'+dayChart([me])+'</div>'+
  '<div class="card"><h3>Tuân thủ nhập liệu</h3><p style="font-size:34px;margin:6px 0"><b>'+(c==null?'—':c+'%')+'</b></p><div class="bar"><i style="width:'+(c||0)+'%"></i></div>'+
  '<p style="color:var(--muted)">'+miss+' ngày làm việc chưa nhập.</p>'+(dn?'':'<button class="btn" onclick="go(\'enter\')">Nhập ngay</button>')+'</div></div>'+tables()}
 var off=scopeOff(),A=sumA(off.map(function(u){return cumPhi(u.ad,MS)})),P=sumA(off.map(function(u){return planOf(u.ad,MS)})),dn2=off.filter(function(u){return doneToday(u.ad)}).length;
 return head('Tổng quan tiến độ',esc(scopeLabel())+' · Phí lũy kế đến T'+MS+'/'+YEAR+' · '+upTo(),depSel()+monSel())+
 '<div class="grid g4"><div class="card kpi"><small>Phí đã thu lũy kế</small><b>'+tr(A)+'</b><span>'+money(A)+' đ · gồm hoa hồng BH</span></div>'+
 '<div class="card kpi"><small>Kế hoạch lũy kế T'+MS+'</small><b>'+tr(P)+'</b><span>'+off.length+' cán bộ</span></div>'+
 '<div class="card kpi"><small>Hoàn thành KH</small><b>'+pct(A,P)+'%</b><div class="bar '+bcls(pct(A,P))+'"><i style="width:'+Math.min(100,pct(A,P))+'%"></i></div></div>'+
 '<div class="card kpi"><small>Đã nhập hôm nay</small><b>'+dn2+'/'+off.length+'</b><span>'+pct(dn2,off.length)+'% cán bộ · chốt '+GIO_CHOT+':00</span></div></div>'+
 bhCard(off)+
 '<div class="card" style="margin-top:14px"><h3>Phí thu theo ngày · '+esc(scopeLabel())+' · tháng '+MS+'</h3>'+dayChart(off)+'<p style="color:var(--muted);margin:26px 0 0;font-size:12px">Cột vàng = hôm nay (chưa chốt)</p></div>'+tables()}
function bhCard(list){var b=BHS.map(function(_,j){return sumA(list.map(function(u){return cumBH(u.ad,MS,j)}))}),tot=sumA(b),hh=sumA(list.map(function(u){return cumHH(u.ad,MS)}));
 return '<div class="card kpi" style="margin-top:14px;display:flex;gap:26px;flex-wrap:wrap;align-items:center"><div><small>Doanh số bảo hiểm lũy kế</small><b>'+tr(tot)+'</b><span>Theo dõi riêng, không cộng vào Phí</span></div>'+
  '<div><small>Hoa hồng BH dự kiến</small><b style="color:var(--accent)">'+tr(hh)+'</b><span>đã tính vào Phí</span></div>'+
  b.map(function(v,j){return '<div><small>'+esc(shortBH(BHS[j]))+' · '+Math.round(rateOf(BHS[j])*100)+'%</small><b style="font-size:19px">'+tr(v)+'</b></div>'}).join('')+'</div>'}

function dayChart(list){
 var t=vnNow().key,ds=workdays(MS).filter(function(x){return x.k<=t&&x.k>=Q_START()}).map(function(x){return{d:x.d,k:x.k,v:sumA(list.map(function(u){var c=cell(u.ad,x.k);return c?c.phi:0}))}});
 if(!ds.length)return '<p style="color:var(--muted)">Chưa có ngày làm việc nào trong tháng này.</p>';
 var mx=Math.max(1,Math.max.apply(null,ds.map(function(x){return x.v})));
 return '<div class="chart">'+ds.map(function(x){return '<div class="'+(x.k===t?'today':'')+'" style="height:'+Math.max(3,x.v/mx*100)+'%" title="'+x.d+'/'+MS+': '+money(x.v)+' đ"><span>'+x.d+'</span></div>'}).join('')+'</div><div style="height:16px"></div>'}

/* Bảng theo loại phí: cột dọc = phòng / cán bộ, cột ngang = loại phí */
var rankPos='ALL',rankDep='all';
/* Bảng theo loại phí. grouped=true: nhóm theo phòng (A, B, C…), phòng và cán bộ trong phòng đều xếp thấp → cao theo Tổng phí */
function typeTable(items,nameHead,grouped){
 var rows=items.map(function(it){var t=FEES.map(function(_,i){return sumA(it.ads.map(function(ad){return cumType(ad,MS,i)}))}),hhv=sumA(it.ads.map(function(ad){return cumHH(ad,MS)})),phi=sumA(t)+hhv,kh=sumA(it.ads.map(function(ad){return planOf(ad,MS)}));
  return{n:it.n,sub:it.sub,me:it.me,grp:it.grp,grpName:it.grpName,t:t,phi:phi,kh:kh,b:BHS.map(function(_,j){return sumA(it.ads.map(function(ad){return cumBH(ad,MS,j)}))}),hh:hhv}}).sort(function(a,b){return a.phi-b.phi});
 var tot={t:FEES.map(function(_,i){return sumA(rows.map(function(r){return r.t[i]}))}),phi:sumA(rows.map(function(r){return r.phi})),kh:sumA(rows.map(function(r){return r.kh})),b:BHS.map(function(_,j){return sumA(rows.map(function(r){return r.b[j]}))}),hh:sumA(rows.map(function(r){return r.hh}))};
 var dash='<span style="color:var(--muted)">–</span>',ncol=2+FEES.length+4+BHS.length;
 var line=function(r,i,isTot){var p=pct(r.phi,r.kh);return '<tr class="'+(isTot?'tot':'')+'"'+(r.me?' style="outline:2px solid var(--accent);outline-offset:-2px"':'')+'><td>'+(isTot?'':i+1)+'</td><td>'+(isTot?'Tổng cộng':esc(r.n)+(r.sub?'<br><small style="color:var(--muted)">'+esc(r.sub)+'</small>':''))+'</td>'+r.t.map(function(x){return '<td class="r">'+(x?money(x):dash)+'</td>'}).join('')+'<td class="r" style="color:var(--accent)">'+(r.hh?money(r.hh):dash)+'</td><td class="r"><b>'+money(r.phi)+'</b></td><td class="r">'+(r.kh?money(r.kh):'–')+'</td><td class="r"><span class="pct '+pcls(p)+'">'+(r.kh?p+'%':'–')+'</span></td>'+r.b.map(function(x,j){return '<td class="r'+(j===0?' sep':'')+'">'+(x?money(x):dash)+'</td>'}).join('')+'</tr>'};
 var body;
 if(grouped){
  var G={},order=[];rows.forEach(function(r){if(!G[r.grp]){G[r.grp]={name:r.grpName,rows:[]};order.push(r.grp)}G[r.grp].rows.push(r)});
  var gs=order.map(function(k){var g=G[k];g.phi=sumA(g.rows.map(function(r){return r.phi}));g.kh=sumA(g.rows.map(function(r){return r.kh}));return g}).sort(function(a,b){return a.phi-b.phi});
  body=gs.map(function(g,gi){var gp=pct(g.phi,g.kh);return '<tr class="grp"><td colspan="'+ncol+'"><b>'+String.fromCharCode(65+gi)+' · '+esc(g.name)+'</b> · '+g.rows.length+' cán bộ · Tổng phí <b>'+money(g.phi)+'</b>'+(g.kh?' · Kế hoạch '+money(g.kh)+' · <span class="pct '+pcls(gp)+'">'+gp+'%</span>':'')+'</td></tr>'+g.rows.map(function(r,i){return line(r,i,false)}).join('')}).join('');
 }else body=rows.map(function(r,i){return line(r,i,false)}).join('');
 return '<div class="scroll" style="max-height:'+(grouped?'620':'480')+'px"><table><thead><tr><th>#</th><th>'+nameHead+'</th>'+FEES.map(function(f){return '<th class="r">'+esc(f)+'</th>'}).join('')+'<th class="r">Hoa hồng BH<br>dự kiến</th><th class="r">Tổng phí</th><th class="r">Kế hoạch lũy kế</th><th class="r">% KH</th>'+BHS.map(function(f,j){return '<th class="r'+(j===0?' sep':'')+'">'+esc(shortBH(f))+'<br>(doanh số)</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?body:'<tr><td colspan="'+ncol+'" style="color:var(--muted);padding:18px">Không có cán bộ nào.</td></tr>')+(rows.length?line(tot,0,true):'')+'</tbody></table></div>'}
/* Hai cách xem (nút chọn ở trên): 'sum' = Số liệu tổng (5 cột), 'det' = Chi tiết từng loại phí. flat=true: không chia nhóm RM/GDV (bảng phòng) */
var viewMode='sum';
function officerTable(items,nameHead,flat){
 var det=viewMode==='det';
 var rows=items.map(function(it){var t=FEES.map(function(_,i){return sumA(it.ads.map(function(ad){return cumType(ad,MS,i)}))}),hhv=sumA(it.ads.map(function(ad){return cumHH(ad,MS)})),phi=sumA(t)+hhv,kh=sumA(it.ads.map(function(ad){return planOf(ad,MS)}));
  return{n:it.n,sub:it.sub,me:it.me,grp:it.grp,t:t,phi:phi,kh:kh,p:pct(phi,kh),b:BHS.map(function(_,j){return sumA(it.ads.map(function(ad){return cumBH(ad,MS,j)}))}),hh:hhv}}).sort(function(a,b){return a.phi-b.phi});
 var ncol=det?5+FEES.length+1+BHS.length:5,dash='<span style="color:var(--muted)">–</span>';
 var sums=function(L){return{t:FEES.map(function(_,i){return sumA(L.map(function(r){return r.t[i]}))}),phi:sumA(L.map(function(r){return r.phi})),kh:sumA(L.map(function(r){return r.kh})),b:BHS.map(function(_,j){return sumA(L.map(function(r){return r.b[j]}))}),hh:sumA(L.map(function(r){return r.hh}))}};
 var pcell=function(r){return r.kh?(det?'<span class="pct '+pcls(r.p)+'">'+r.p+'%</span>':'<div class="pw"><span class="pct '+pcls(r.p)+'">'+r.p+'%</span><div class="bar '+bcls(r.p)+'"><i style="width:'+Math.min(100,r.p)+'%"></i></div></div>'):'<span style="color:var(--muted)">–</span>'};
 var line=function(r,i,isTot){

  if(det)h+=r.t.map(function(x,j){return '<td class="r'+(j===0?' sep':'')+'">'+(x?money(x):dash)+'</td>'}).join('')+'<td class="r" style="color:var(--accent)">'+(r.hh?money(r.hh):dash)+'</td>'+r.b.map(function(x,j){return '<td class="r'+(j===0?' sep':'')+'">'+(x?money(x):dash)+'</td>'}).join('');
  return h+'</tr>'};
 var ROMAN=['I','II','III'],groups=[['RM','RM'],['GDV','GDV']],body='',gi=0;
 if(flat)body=rows.map(function(r,i){return line(r,i)}).join('');
 else groups.forEach(function(g){var L=rows.filter(function(r){return r.grp===g[0]});if(!L.length)return;var sm=sums(L),gp=pct(sm.phi,sm.kh);
  body+='<tr class="grp"><td colspan="'+ncol+'"><b>'+ROMAN[gi++]+'. '+g[1]+'</b> · '+L.length+' cán bộ · Tổng phí <b>'+money(sm.phi)+'</b>'+(sm.kh?' · Kế hoạch '+money(sm.kh)+' · <span class="pct '+pcls(gp)+'">'+gp+'%</span>':'')+'</td></tr>'+L.map(function(r,i){return line(r,i)}).join('')});
 var tot=sums(rows);tot.n='Tổng cộng ('+rows.length+')';tot.p=pct(tot.phi,tot.kh);
 var head='<th class="k1">#</th><th class="k2">'+(nameHead||'Cán bộ')+'</th><th class="r kk kk1">Tổng phí<br>lũy kế</th><th class="r kk kk2">Kế hoạch<br>lũy kế</th><th class="r kk kk3">% hoàn<br>thành</th>'+(det?FEES.map(function(f,j){return '<th class="r'+(j===0?' sep':'')+'">'+esc(f)+'</th>'}).join('')+'<th class="r">Hoa hồng BH<br>dự kiến</th>'+BHS.map(function(f,j){return '<th class="r'+(j===0?' sep':'')+'">'+esc(shortBH(f))+'<br>(doanh số)</th>'}).join(''):'');
 return '<div class="scroll" style="max-height:640px"><table class="ofc'+(det?' det':'')+'"><thead><tr>'+head+'</tr></thead><tbody>'+(rows.length?body+line(tot,0,true):'<tr><td colspan="'+ncol+'" style="color:var(--muted);padding:18px">Không có cán bộ nào.</td></tr>')+'</tbody></table></div>'}
function tables(){

 var base=OFF.filter(function(u){return rankDep==='all'||u.dep===rankDep});

 var depSel2='<select onchange="rankDep=this.value;render()" style="width:auto"><option value="all"'+(rankDep==='all'?' selected':'')+'>Tất cả các Phòng</option>'+DEPS.map(function(d){return '<option value="'+d[0]+'"'+(rankDep===d[0]?' selected':'')+'>'+esc(d[1])+'</option>'}).join('')+'</select>';

 var today=L.filter(function(u){return daysOfU(u)[t]}).length,never=L.filter(function(u){return !(LOGINS[u.ad].last)}).length;
 var groups=[['',  'Ban giám đốc / Tổ chức']].concat(DEPS).filter(function(g){return L.some(function(u){return(u.dep||'')===g[0]})});
 var hdr=days.map(function(x){return '<th class="s" style="'+(x.off?'background:var(--line)':'')+(x.k===t?';color:var(--accent)':'')+'">'+x.d+'<br><span style="font-weight:400">'+WK[x.w]+'</span></th>'}).join('');
 var body=groups.map(function(g){return '<tr class="dep"><td colspan="'+(days.length+3)+'" style="position:sticky;left:0;cursor:default">'+esc(g[1])+'</td></tr>'+L.filter(function(u){return(u.dep||'')===g[0]}).map(function(u){var set=daysOfU(u),n=0;
  var cells=days.map(function(x){var c='idle',tip='Không truy cập';if(set[x.k]){c='ok';tip='Có truy cập';n++}else if(x.off)c='off';else if(x.k>t||x.k<Q_START())c='fut';
   return '<td class="s"><span class="c '+c+'" title="'+esc(u.n)+' · '+x.d+'/'+MS+': '+tip+'" onclick="toast(this.title)"></span></td>'}).join('');
  var last=LOGINS[u.ad].last;
  return '<tr><td class="nm">'+esc(u.n)+'<br><small style="color:var(--muted)">'+esc(u.ad)+' · '+(u.role==='staff'?POS_LABEL[u.pos]:ROLE_LABEL[u.role])+'</small></td>'+cells+'<td class="t">'+n+'</td><td class="t" style="min-width:110px;font-weight:500">'+(last?last.slice(8,10)+'/'+last.slice(5,7)+' '+last.slice(11):'<span class="pill r">Chưa vào</span>')+'</td></tr>'}).join('')}).join('');
 return head('Tình hình đăng nhập theo user',esc(scopeLabel())+' · Tháng '+MS+'/'+YEAR,depSel()+monSel())+
 '<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Tổng số user</small><b>'+L.length+'</b></div><div class="card kpi"><small>Đã vào hôm nay</small><b>'+today+'</b><span>'+pct(today,L.length)+'%</span></div><div class="card kpi"><small>Chưa từng đăng nhập</small><b style="color:'+(never?'var(--danger)':'var(--accent)')+'">'+never+'</b></div><div class="card kpi"><small>Ghi nhận</small><span>Mỗi user mỗi ngày 1 lần khi đăng nhập hoặc mở lại ứng dụng.</span></div></div>'+
 '<div class="legend"><span><i style="background:var(--ok)"></i>Có truy cập trong ngày</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Không truy cập</span><span><i style="background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 4px,var(--line) 4px,var(--line) 5px)"></i>Nghỉ</span></div>'+
 '<div class="scroll"><table class="mx"><thead><tr><th class="nm">User</th>'+hdr+'<th class="t">Số ngày</th><th class="t">Gần nhất</th></tr></thead><tbody>'+body+'</tbody></table></div>'}

/* ================= 7. BÁO CÁO ================= */
function vRep(){return head('Báo cáo','Xuất số liệu theo phạm vi của bạn',depSel()+monSel())+
 '<div class="grid g2"><div class="card"><h3>Bảng tiến độ cán bộ · lũy kế đến T'+MS+'</h3><p style="color:var(--muted)">'+esc(scopeLabel())+' · '+scopeOff().length+' cán bộ: từng loại phí, tổng phí, kế hoạch, % hoàn thành, % tuân thủ, bảo hiểm riêng.</p><button class="btn" onclick="exportCsv()">Tải CSV (mở bằng Excel)</button></div>'+
 '<div class="card"><h3>Sổ giao dịch</h3><p style="color:var(--muted)">Chi tiết từng khách hàng, từng loại phí trong tháng '+MS+'.</p><button class="btn ghost" onclick="exportBook()">Tải sổ giao dịch (CSV)</button></div></div>'}
function exportCsv(){var r=[['Phòng','Cán bộ','User AD','Chức danh'].concat(FEES,['Hoa hồng BH dự kiến','Tổng phí','Kế hoạch lũy kế T'+MS,'% hoàn thành','% tuân thủ'],BHS)].concat(scopeOff().map(function(u){var a=cumPhi(u.ad,MS),p=planOf(u.ad,MS),c=compliance(u.ad,MS);
  return [u.depName,u.n,u.ad,POS_LABEL[u.pos]].concat(FEES.map(function(_,i){return cumType(u.ad,MS,i)}),[cumHH(u.ad,MS),a,p,pct(a,p),c==null?'':c],BHS.map(function(_,j){return cumBH(u.ad,MS,j)}))}));
 download('tien-do-T'+MS+'.csv',r.map(function(a){return a.map(csvCell).join(',')}).join('\n'))}

/* ================= 8. QUẢN TRỊ ================= */
var admQ='',admDep='all',RAW={staff:'canbo',head:'lanhdao',gd:'bgd',admin:'quanly'};
function vAdm(){
 var q=admQ.toLowerCase();
 var L=U.filter(function(u){return (admDep==='all'||(admDep==='_'?!u.dep:u.dep===admDep))&&(!q||(u.ad+' '+u.n).toLowerCase().indexOf(q)>=0)});
 return head('Quản trị tài khoản',U.length+' tài khoản · bấm <b>Sửa</b> để đổi phòng, chức danh, vai trò',
  '<select onchange="admDep=this.value;render()"><option value="all">Tất cả phòng</option>'+DEPS.map(function(d){return '<option value="'+d[0]+'"'+(admDep===d[0]?' selected':'')+'>'+d[1]+'</option>'}).join('')+'<option value="_"'+(admDep==='_'?' selected':'')+'>Ban giám đốc / Quản trị</option></select>'+
  '<input placeholder="Tìm User AD hoặc tên" style="min-width:190px" value="'+esc(admQ)+'" onchange="admQ=this.value;render()">'+
  '<button class="btn" onclick="editUser(null)">+ Thêm tài khoản</button>')+
 '<div class="scroll"><table><thead><tr><th>User AD</th><th>Họ tên</th><th>Phòng / Ban</th><th>Chức danh</th><th>Vai trò</th><th></th></tr></thead><tbody>'+
 L.map(function(u){return '<tr><td>'+esc(u.ad)+'</td><td>'+esc(u.n)+'</td><td>'+esc(u.depName)+'</td><td>'+(POS_LABEL[u.pos]||'—')+'</td><td><span class="pill '+(u.role==='staff'?'':'g')+'">'+ROLE_LABEL[u.role]+'</span></td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="editUser(\''+esc(u.ad)+'\')">Sửa</button> <button class="btn ghost sm" onclick="resetPin(\''+esc(u.ad)+'\')">Đặt lại PIN</button></td></tr>'}).join('')+
 (L.length?'':'<tr><td colspan="6" style="color:var(--muted);padding:20px">Không có tài khoản phù hợp.</td></tr>')+'</tbody></table></div>'}
function editUser(ad){
 var u=ad?U.filter(function(x){return x.ad===ad})[0]:{ad:'',n:'',dep:'',role:'staff',pos:'GDV'},isNew=!ad,self=!isNew&&u.ad.toLowerCase()===me.ad.toLowerCase();
 var depOpts=DEPS.map(function(d){return '<option value="'+d[0]+'"'+(u.dep===d[0]?' selected':'')+'>'+d[1]+'</option>'}).join('');
 $('dlgBody').innerHTML='<h3 style="margin:0 0 4px">'+(isNew?'Thêm tài khoản':'Sửa tài khoản')+'</h3>'+
  '<label>User AD</label><input id="eAd" value="'+esc(u.ad)+'" '+(isNew?'placeholder="VD: NAMNV1"':'disabled')+'>'+
  '<label>Họ và tên</label><input id="eName" value="'+esc(u.n)+'">'+
  '<label>Vai trò</label><select id="eRole" onchange="roleUi()" '+(self?'disabled':'')+'>'+[['canbo','Cán bộ (GDV / RM) – nhập phí'],['lanhdao','Lãnh đạo phòng – nhập kế hoạch cho phòng'],['bgd','Ban giám đốc / Tổ chức – xem tất cả'],['quanly','Quản trị – toàn quyền']].map(function(r){return '<option value="'+r[0]+'"'+(RAW[u.role]===r[0]?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select>'+
  '<div id="eDepBox"><label>Phòng / PGD</label><select id="eDep">'+depOpts+'</select></div>'+
  '<div id="ePosBox"><label>Chức danh</label><select id="ePos"><option value="GDV"'+(u.pos==='GDV'?' selected':'')+'>Giao dịch viên (GDV)</option><option value="RM"'+(u.pos==='RM'?' selected':'')+'>RM</option></select></div>'+
  (self?'<p style="color:var(--muted);font-size:12px">Bạn không thể đổi vai trò của chính mình (tránh mất quyền quản trị).</p>':'')+
  (isNew?'<p style="color:var(--muted);font-size:12px">Hệ thống tự tạo mã PIN 6 số và hiện sau khi lưu.</p>':'')+
  '<div style="margin-top:14px"><button class="btn" onclick="saveUser(\''+(isNew?'':esc(u.ad))+'\')">Lưu</button></div>';
 $('dlg').showModal();roleUi()}
function roleUi(){var r=$('eRole').value;$('eDepBox').style.display=(r==='canbo'||r==='lanhdao')?'block':'none';$('ePosBox').style.display=r==='canbo'?'block':'none'}
async function saveUser(ad){
 var isNew=!ad,r=$('eRole').value,body={action:isNew?'adduser':'setuser',ad:isNew?$('eAd').value.trim():ad,name:$('eName').value.trim(),role:r,dep:(r==='canbo'||r==='lanhdao')?$('eDep').value:'',pos:r==='canbo'?$('ePos').value:(r==='lanhdao'||r==='bgd'?'LD':'')};
 if(!body.ad||!body.name){toast('Nhập User AD và họ tên');return}
 if(isNew&&!/^[A-Za-z0-9._-]{2,40}$/.test(body.ad)){toast('User AD chỉ gồm chữ, số, dấu chấm, gạch');return}
 var j=await post(body);if(!j)return;
 if(j.newPin){$('dlgBody').innerHTML='<h3 style="margin:0 0 8px">Đã tạo tài khoản</h3><p>User <b>'+esc(j.newPinFor)+'</b></p><p style="font-size:30px;letter-spacing:4px;margin:8px 0"><b>'+esc(j.newPin)+'</b></p><p style="color:var(--muted)">Gửi riêng PIN cho người dùng.</p>'}else{$('dlg').close();toast('Đã lưu thay đổi')}
 render()}
async function resetPin(ad){if(!confirm('Đặt lại PIN cho '+ad+'? Người này sẽ bị đăng xuất và phải dùng PIN mới.'))return;
 var j=await post({action:'resetpin',ad:ad});if(j&&j.newPin){$('dlgBody').innerHTML='<h3 style="margin:0 0 8px">PIN mới</h3><p>User <b>'+esc(j.newPinFor)+'</b></p><p style="font-size:30px;letter-spacing:4px;margin:8px 0"><b>'+esc(j.newPin)+'</b></p><p style="color:var(--muted)">Gửi riêng cho người dùng. PIN này chỉ hiện một lần ở đây (vẫn xem được trong Google Sheet, trang CanBo).</p>';$('dlg').showModal()}}

/* ================= KHỞI ĐỘNG ================= */
(function(){try{token=localStorage.getItem(TKEY)}catch(e){}
 if(token){$('login').classList.add('hide');$('busy').classList.remove('hide');
  fetch(API_URL+'?token='+encodeURIComponent(token)+'&t='+Date.now()).then(function(r){return r.json()}).then(function(j){$('busy').classList.add('hide');if(ok(j)){applyRemote(j);start()}else logout()}).catch(function(){$('busy').classList.add('hide');logout('Không kết nối được máy chủ.')})}
 setInterval(function(){if(me&&!document.hidden&&!editing())fetchData(true)},60000);
 document.addEventListener('visibilitychange',function(){if(me&&!document.hidden&&!editing())fetchData(true)})})();
</script>
</body>
